<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>EasyStreams Player</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: #fff; }
        #selector { margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>EasyStreams Player</h1>
    <div id="selector">
        <label>Scegli sorgente:</label>
        <select id="stream-select"></select>
    </div>

    <video id="my-video" class="video-js vjs-big-play-centered" controls width="800" height="450">
        <p>Caricamento in corso...</p>
    </video>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        const player = videojs('my-video');
        const select = document.getElementById('stream-select');

        async function init() {
            try {
                const response = await fetch('https://easystreams.realbestia.com/stream/movie/597.json');
                const data = await response.json();

                data.streams.forEach((stream, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.text = stream.name + " - " + stream.title.split('\n')[1];
                    select.appendChild(option);
                });

                select.addEventListener('change', (e) => {
                    const s = data.streams[e.target.value];
                    player.src({ src: s.url, type: s.url.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
                    player.play();
                });

                // Carica il primo di default
                if(data.streams.length > 0) {
                    player.src({ src: data.streams[0].url, type: 'application/x-mpegURL' });
                }
            } catch (err) {
                console.error("Errore caricamento stream:", err);
            }
        }

        init();
    </script>
</body>
</html>
